<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naruto Deck Builder</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Naruto Deck Builder</h1>
      <div class="nav-buttons">
        <button onclick="switchTab('databaseTab')" id="btnDatabase" class="active">📚 Database</button>
        <button onclick="switchTab('collectionTab')" id="btnCollection">Collection (<span id="uniqueOwnedCount">0</span>)</button>
        <button onclick="switchTab('deckTab')" id="btnDeck">Active Deck (<span id="deckCountBadge">0</span>/6)</button>
        <button onclick="switchTab('aiTab')" id="btnAi">AI Calculator</button>
      </div>
    </header>

    <!-- DATABASE TAB -->
    <section id="databaseTab" class="tab-content active">
      <div class="toolbar">
        <select id="seasonSelect" onchange="filterDatabase()">
          <option value="all">All Seasons</option>
          <option value="season_1">Season 1</option>
          <option value="season_2">Season 2</option>
          <option value="season_3">Season 3</option>
        </select>
        <input type="text" id="dbSearchInput" placeholder="Search master database by name or ID..." oninput="filterDatabase()" />
      </div>
      <div id="databaseGrid" class="card-grid">
        <div class="placeholder">Loading master database...</div>
      </div>
    </section>

    <!-- COLLECTION TAB -->
    <section id="collectionTab" class="tab-content">
      <div class="toolbar">
        <input type="file" id="collectionFileInput" accept=".json" onchange="handleCollectionUpload(event)" style="display: none;" />
        <button class="btn primary" onclick="document.getElementById('collectionFileInput').click()">Import Collection JSON</button>
        <input type="text" id="searchInput" placeholder="Search collection..." oninput="filterCollection()" />
      </div>
      <div id="collectionGrid" class="card-grid">
        <div class="placeholder">Import your collection JSON to view cards.</div>
      </div>
    </section>

    <!-- ACTIVE DECK TAB -->
    <section id="deckTab" class="tab-content">
      <div class="toolbar">
        <h2>Active Deck (Max 6 Cards)</h2>
        <button class="btn danger" onclick="clearActiveDeck()">Clear Deck</button>
      </div>
      <div id="activeDeckGrid" class="card-grid">
        <div class="placeholder">Your active deck is empty. Add cards from database or collection.</div>
      </div>
    </section>

    <!-- AI TAB -->
    <section id="aiTab" class="tab-content">
      <div class="toolbar">
        <select id="strategySelect">
          <option value="balanced">Balanced Strategy</option>
          <option value="team7">Team 7 Focus</option>
          <option value="rarity">Pure Rarity</option>
        </select>
        <button class="btn primary" id="calcBtn" onclick="generateOptimalDeckUI()" disabled>Run AI Deck Builder</button>
      </div>
      <div id="aiDeckGrid" class="card-grid">
        <div class="placeholder">Run AI calculation to generate your 6-card deck.</div>
      </div>
    </section>
  </div>

  <script src="/calculator.js"></script>
  <script src="/app.js"></script>
</body>
</html>
